<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAZO - Puzzle Challenge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #D16BA5 0%, #A5477A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0,0,0,0.25);
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            color: #D16BA5;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .tagline {
            color: #999;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .challenge-card {
            background: #FDF2F6;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .challenge-card h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 6px;
        }
        .time-badge {
            display: inline-block;
            background: #D16BA5;
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            margin-top: 10px;
        }
        .time-badge.empty {
            background: #ccc;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #F3E8EF;
            border-top-color: #D16BA5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 16px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }
        .store-btn {
            display: inline-block;
            background: #D16BA5;
            color: white;
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .store-btn:hover {
            background: #A5477A;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">TRAZO</div>
        <div class="tagline">Trace the path. Fill the grid.</div>

        <div class="challenge-card" id="challenge-card">
            <h2 id="challenge-text">Level Challenge!</h2>
            <div class="time-badge" id="time-badge"></div>
        </div>

        <div class="spinner" id="spinner"></div>
        <p class="status" id="status">Opening TRAZO...</p>

        <a class="store-btn hidden" id="store-btn" href="#">Get TRAZO</a>
    </div>

    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var level = params.get('level') || '0';
        var time = params.get('time') || '';
        var levelNum = parseInt(level, 10) + 1;

        // Show challenge info
        document.getElementById('challenge-text').textContent = 'Level ' + levelNum + ' Challenge!';

        if (time && time !== '0') {
            var mins = Math.floor(parseInt(time, 10) / 60);
            var secs = parseInt(time, 10) % 60;
            var timeStr = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
            document.getElementById('time-badge').textContent = 'Beat ' + timeStr;
        } else {
            document.getElementById('time-badge').textContent = 'Unsolved';
            document.getElementById('time-badge').classList.add('empty');
        }

        // === CHANGE THESE to your actual values ===
        var PACKAGE_NAME = 'com.gatch.trazo';
        var APP_SCHEME = 'trazo';
        var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=' + PACKAGE_NAME;

        // Build deep link
        var deepLink = APP_SCHEME + '://play?level=' + level + '&time=' + time;

        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPad|iPhone|iPod/.test(ua);
        var redirected = false;

        if (isAndroid) {
            // Android: use Intent URL for reliable app opening
            var fallback = encodeURIComponent(PLAY_STORE_URL);
            var intentUrl = 'intent://play?level=' + level + '&time=' + time
                + '#Intent;scheme=' + APP_SCHEME
                + ';package=' + PACKAGE_NAME
                + ';S.browser_fallback_url=' + fallback + ';end';

            window.location.href = intentUrl;

            // Safety net
            setTimeout(function() {
                if (!document.hidden && !redirected) {
                    showStoreButton(PLAY_STORE_URL);
                }
            }, 2000);
        } else if (isIOS) {
            // iOS: try custom scheme, fall back to App Store
            window.location.href = deepLink;

            setTimeout(function() {
                if (!document.hidden && !redirected) {
                    showStoreButton('https://apps.apple.com/'); // Update with your iOS app URL
                }
            }, 1500);
        } else {
            // Desktop: just show the challenge
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent =
                'Open this link on your phone to play TRAZO!';
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) redirected = true;
        });
        window.addEventListener('blur', function() { redirected = true; });

        function showStoreButton(url) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = 'App not installed yet';
            document.getElementById('store-btn').href = url;
            document.getElementById('store-btn').classList.remove('hidden');
        }
    })();
    </script>
</body>
</html>
